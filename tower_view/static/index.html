<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LPI-CogRadar · Tower View v1</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">TV</span>
      <div><strong>Tower View</strong><small>GLOBAL TRACK · ENU / v1</small></div>
    </div>
    <label class="scenario-picker">回放场景<select id="scenarioSelect"></select></label>
    <div id="statusPill" class="status-pill">正在载入</div>
    <div id="debugBanner" class="debug-banner hidden">⚠ DEBUG / GROUND TRUTH OVERLAY</div>
  </header>

  <main class="workspace">
    <section class="map-panel">
      <div class="map-heading">
        <div><span class="eyebrow">CENTRAL SITUATION</span><h1 id="scenarioTitle">全局态势</h1></div>
        <div class="legend">
          <span><i class="dot radar"></i>雷达</span>
          <span><i class="dot local"></i>Local Track</span>
          <span><i class="dot global"></i>Global Track</span>
          <span><i class="line mapping"></i>归属</span>
        </div>
      </div>
      <div id="canvasWrap" class="canvas-wrap">
        <canvas id="towerCanvas"></canvas>
        <div class="axis-label east">E / East</div>
        <div class="axis-label north">N / North</div>
        <div id="emptyState" class="empty-state">本帧尚无全局航迹</div>
        <div id="negativeBanner" class="negative-banner hidden"></div>
      </div>
    </section>

    <aside class="side-panel">
      <div class="panel-title"><span>GLOBAL TRACKS</span><b id="trackCount">0</b></div>
      <div id="trackList" class="track-list"></div>
      <div class="detail-card">
        <div class="panel-title"><span>SELECTED TRACK</span></div>
        <div id="trackDetail" class="track-detail muted">点击一条 global track 查看详情</div>
      </div>
      <div class="event-card">
        <div class="panel-title"><span>RECENT CI / LIFECYCLE</span></div>
        <div id="eventList" class="event-list muted">本帧无新增事件</div>
      </div>
    </aside>
  </main>

  <footer class="timeline-panel">
    <button id="prevButton" title="上一帧">◀│</button>
    <button id="playButton" class="primary" title="播放 / 暂停">▶</button>
    <button id="nextButton" title="下一帧">│▶</button>
    <div class="time-readout"><strong id="timeValue">T+0.0s</strong><small id="frameValue">FRAME 0 / 0</small></div>
    <input id="timeline" type="range" min="0" max="0" value="0" step="1" aria-label="时间轴">
    <div class="playback-rate">1 frame / 700 ms</div>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
